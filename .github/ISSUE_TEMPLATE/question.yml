name: Question
description: Ask a question about using or developing atomic-crm
title: "[Question]: "
labels: ["question"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Have a question? We're here to help! Please provide as much context as possible.

  - type: dropdown
    id: category
    attributes:
      label: Question Category
      description: What is your question about?
      options:
        - Installation & Setup
        - Configuration
        - Usage & Features
        - Development & Contributing
        - Deployment
        - Integration
        - Troubleshooting
        - Best Practices
        - Other
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know?
      placeholder: Please describe your question in detail...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Provide any relevant context that might help us answer your question.
      placeholder: |
        - What have you already tried?
        - What documentation have you consulted?
        - What is your use case?
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment (if applicable)
      description: If your question is environment-specific, please provide details.
      placeholder: |
        - OS: macOS 14.0
        - Node version: v22.14.0
        - Browser: Chrome 120
        - Deployment: Vercel
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Code Snippets
      description: If applicable, add screenshots or code snippets to help explain your question.
      placeholder: Paste or drag images/code here...
    validations:
      required: false

  - type: checkboxes
    id: searched
    attributes:
      label: Research Done
      description: Have you checked existing resources?
      options:
        - label: I have searched existing issues and discussions
          required: true
        - label: I have checked the documentation
          required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
